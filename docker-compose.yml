services:

  ml-service:
    image: ${ML_IMAGE:-careerforge-ml}
    build:
      context: ./ml-service
    container_name: careerforge-ml

  backend:
    image: ${BACKEND_IMAGE:-careerforge-backend}
    build:
      context: ./backend
    container_name: careerforge-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - ml-service

  frontend:
    image: ${FRONTEND_IMAGE:-careerforge-frontend}
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: careerforge-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
